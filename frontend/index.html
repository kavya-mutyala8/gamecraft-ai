<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GameCraft AI: Game Asset Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header class="top">
        <div>
          <h1>GameCraft AI</h1>
          <p>Describe your game once. Get a matching set of art.</p>
        </div>
        <div class="logo" aria-hidden="true">
          <svg
            width="40"
            height="40"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="6" x2="10" y1="11" y2="11" />
            <line x1="8" x2="8" y1="9" y2="13" />
            <line x1="15" x2="15.01" y1="12" y2="12" />
            <line x1="18" x2="18.01" y1="10" y2="10" />
            <path
              d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"
            />
          </svg>
        </div>
      </header>

      <nav id="stepper" class="stepper" aria-label="Progress"></nav>
      <main id="view"></main>

      <footer class="foot">
        <span id="foot-left"></span>
        <strong>MADE FOR YOUR NEXT WORLD ✦</strong>
      </footer>
    </div>

    <dialog id="viewer">
      <img id="viewer-img" alt="" />
      <div class="viewer-bar">
        <strong id="viewer-title"></strong>
        <span>
          <button type="button" id="viewer-download" class="btn btn-yellow">
            Download
          </button>
          <button type="button" id="viewer-close" class="btn">Close</button>
        </span>
      </div>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
